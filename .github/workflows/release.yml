name: release

# A maintainer pushes a signed vX.Y.Z tag from main. This workflow re-runs
# the checks on that exact commit and drafts a GitHub release; a maintainer
# reviews the notes and publishes it. Go modules are served from the tag by
# the module proxy, so there are no binaries to upload.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod states the minimum; check-latest picks up current security fixes.
          go-version: "1.27.3"
          check-latest: true
      - run: make check vuln
      - run: python3 scripts/check-repo.py --release .

  draft:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$TAG"
